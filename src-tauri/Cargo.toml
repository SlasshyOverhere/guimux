[package]
name = "guimux"
version = "0.1.0"
description = "Lean Orca alternative — worktrees, terminals, nothing else"
edition = "2021"

[lib]
name = "guimux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
portable-pty = "0.8"
dirs = "5"
[dependencies.tauri-plugin-mcp-bridge]
version = "0.13.0"
optional = true

[features]
default = []
# Debug-only MCP bridge: enable with --features debug-mcp in dev.
# (cfg(debug_assertions) cannot select dependencies; the plugin init in
# lib.rs stays cfg-gated so release never references it.)
debug-mcp = ["dep:tauri-plugin-mcp-bridge"]
