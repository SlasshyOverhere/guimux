[package]
name = "guimux"
version = "0.1.0"
description = "Lean Orca alternative — worktrees, terminals, nothing else"
edition = "2021"

[lib]
name = "guimux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
git2 = "0.19"
notify = "6"
dirs = "5"
tauri-plugin-mcp-bridge = "0.13.0"
